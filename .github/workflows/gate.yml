# The gate, on a MANUAL trigger only — and since W152 it is the LADDER, `npm run gate`.
#
# It ran on every push and every pull request from `da7e6c7` until the maintainer
# asked for this. What changed then was who decides when, and that is a real
# reduction in what CI guarantees — see the `on:` block below for what it costs and
# what still holds.
#
# **No workflow runs `gate:full`** — the maintainer, 2026-10-10 (W152 Outputs (12)): it
# takes far too long. Until W152 this step ran `gate:full`, the ladder plus the
# self-tests that prove the checks can fail. Those now run ONLY LOCALLY: a plan's last
# item, and an item that edits the register files (doc/workflow.md v0.29). ADR 0070's
# *proving the checks can fail belongs to CI* no longer holds anywhere, and that ADR
# carries a dated note saying so. The JSR checks run on every push in ci.yml, and the
# ladder runs again inside publish.yml before anything is published.
#
# `npm run gate` is ONE step on purpose. It is an `&&` chain — its length is
# package.json's, and the count that stood here went stale at W116's seventeenth entry — that
# climbs the ladder in order (ADR 0039), and `S12` in scripts/check-source.mjs
# asserts that chain's membership AND its order against package.json, both ways.
# Splitting it into one CI step per entry would put a second copy of that list in a
# file `S12` cannot see — rule 8 obligation (e)'s third shape, a LIST that is a
# claim about another list, bound to nothing. So the chain stays in the manifest
# and this workflow runs it whole and reads its exit code.
#
# Nothing here pipes a rung (doc/workflow.md section 4): the step's own exit
# status is the predicate, and a line of its output is never the predicate.

name: gate

# **MANUAL ONLY.** `workflow_dispatch` is the one trigger: run it from the Actions
# tab, or `gh workflow run gate.yml --ref <branch>`.
#
# What this gives up, stated rather than left implicit: a commit can now be pushed
# with the gate never having run on it, and nothing on GitHub will say so. That is
# the guarantee ADR 0070 bought — it moved the self-tests OFF the local ladder on
# the argument that CI is where proving the checks can fail belongs, *because
# nobody is watching and it runs on every commit*. The second half of that reason
# no longer holds, and since W152 neither half does: the self-tests run only
# locally, via `npm run gate:full`, and never here.
#
# What still holds: `npm run gate` is the local ladder and is unchanged, so lint,
# typecheck, the static checks and L1-L6 in three runtimes are still what a commit is
# made behind, and it is what this workflow runs. The self-tests that prove those
# checks can fail are not run by any workflow (see the header).
on:
  workflow_dispatch:

# Two manual runs on one ref: the newer one wins. There is no superseded-commit
# case to cancel any more, which was this block's original reason.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # The ladder alone; the self-tests that made this the long pole are no longer here.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # `.node-version` is the single source of truth for the Node major, and
      # `engines` says >=22. Read the file rather than restating the number.
      - name: Node from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Deno is needed by FOUR entries and one of them is the chain's first:
      # `lint` is `deno lint`, plus `test:deno`, `typecheck:deno` and
      # `test:l6:deno`.
      #
      # The version is READ from `.deno-version` rather than written here, so the
      # pin has one source. `D3` in scripts/check-scheduler.mjs exists because
      # the SCHEDULER's version living in two places is a live hazard; Deno's own
      # version lived in none until this file, and a literal here would have made
      # this file the second place the moment anyone wrote it down again.
      #
      # It is read in a step of its own rather than through a `deno-version-file`
      # input, so the wiring is visible in the log and does not depend on an
      # input this action may or may not support at a given major.
      - name: Read .deno-version
        id: deno
        run: echo "version=$(cat .deno-version)" >> "$GITHUB_OUTPUT"

      - name: Deno from .deno-version
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.deno.outputs.version }}

      - name: Install (lockfile exact)
        run: npm ci

      # `test:browser` launches chromium only (scripts/run-browser-tests.mjs:68);
      # firefox and webkit are `test:browser:all`, which the gate does not run.
      - name: Playwright chromium
        run: npx playwright install --with-deps chromium

      # The LADDER, one step, its exit status the verdict. NOT `gate:full`: no workflow
      # runs the self-tests (the header, and ADR 0070's dated note of 2026-10-10).
      - name: npm run gate
        run: npm run gate
